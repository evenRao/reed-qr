[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "reed-qr"
version = "0.1.0"
description = "QR encoding and decoding with a Rust core and typed Python API"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "licenses/RUST-THIRD-PARTY.txt",
    "licenses/RUST-STDLIB.html",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/evenRao/reed-qr#readme"
Source = "https://github.com/evenRao/reed-qr"
Issues = "https://github.com/evenRao/reed-qr/issues"

[project.scripts]
reed-qr = "reed_qr.cli:main"

[project.optional-dependencies]
livekit = [
    "livekit>=1.1.21,<2",
]

[dependency-groups]
dev = ["maturin>=1.15,<2", "pytest>=9.1.1,<10", "ruff>=0.17.3,<1", "mypy>=2.4,<3", "segno>=1.6.6,<2"]

[tool.maturin]
manifest-path = "crates/reed-qr-python/Cargo.toml"
python-source = "python"
module-name = "reed_qr._native"
include = [
    { path = "uv.lock", format = "sdist" },
    { path = ".python-version", format = "sdist" },
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = "ARCHITECTURE.md", format = "sdist" },
    { path = "LICENSE_AUDIT.md", format = "sdist" },
    { path = "CONTRIBUTING.md", format = "sdist" },
    { path = "docs/**/*.md", format = "sdist" },
    { path = "examples/**/*.py", format = "sdist" },
    { path = "scripts/*.py", format = "sdist" },
    { path = "tests/**/*.py", format = "sdist" },
    { path = "licenses/manifest.json", format = "sdist" },
    { path = "licenses/python-dependencies.json", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["python/reed_qr"]

[[tool.mypy.overrides]]
# NumPy's current installed stubs use newer grammar than our 3.11 source target.
# We do not expose NumPy types; keep its transitive stubs outside this check.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
