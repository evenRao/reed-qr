[workspace]
members = ["crates/reed-qr-core", "crates/reed-qr-python"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
rxing = { version = "=0.9.3", default-features = false, features = ["qrcode", "encoders", "decoders", "multi_barcode_readers", "encoding_rs"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
thiserror = "2.0.21"
pyo3 = "=0.30.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
